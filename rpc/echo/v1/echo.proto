syntax = "proto3";

package execution_record.v1;

message ExecutionRecord {
  string id = 1;
  string order_id = 2;
  string worker_id = 3;
  string status = 4;
  string start_time = 5;
  string end_time = 6;
  int32 duration_minutes = 7;
  string created_at = 8;
  string updated_at = 9;
}

message StartServiceRequest {
  string order_id = 1;
  string worker_id = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message StartServiceResponse {
  ExecutionRecord record = 1;
}

message EndServiceRequest {
  string record_id = 1;
  string actor_user_id = 2;
  string actor_role = 3;
}

message EndServiceResponse {
  ExecutionRecord record = 1;
}

message QueryServiceRecordsRequest {
  string actor_user_id = 1;
  string actor_role = 2;
  string worker_id = 3;
}

message QueryServiceRecordsResponse {
  repeated ExecutionRecord records = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

service ExecutionRecordService {
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);
  rpc EndService(EndServiceRequest) returns (EndServiceResponse);
  rpc QueryServiceRecords(QueryServiceRecordsRequest) returns (QueryServiceRecordsResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
